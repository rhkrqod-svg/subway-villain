<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: game screen, touch pad below on phones, ranking board below that. Single dark look tinted with Line 7 olive, by choice. */
:root{
  --bg:#0d120f; --panel:#171e19; --line7:#747f00; --line7hi:#c6d33a; --gold:#e3b75c; --fg:#e9eee8; --muted:#8e9a90; --edge:#2b352d; --red:#ff7a5c; --blue:#2e8fe4;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 24px;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:var(--display);font-size:20px;color:var(--gold);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.badge{font:700 11px var(--body);color:#fff;background:var(--line7);border-radius:999px;width:20px;height:20px;display:grid;place-items:center}
.tools{display:flex;gap:6px}
.mini{font:700 12px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;cursor:pointer}
.mini:hover{color:var(--fg)}
.mini.icon{padding:5px 10px;display:grid;place-items:center}
.mini:focus-visible,.btn:focus-visible,.cta:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
canvas{display:block;aspect-ratio:16/9;max-width:100%;
  width:min(100%, calc((100vh - 110px) * 16 / 9));width:min(100%, calc((100dvh - 110px) * 16 / 9));
  background:#000;border-radius:6px;border:1px solid var(--edge);touch-action:none;cursor:pointer}
.pad{display:none;width:100%;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.grp{display:flex;gap:8px;align-items:center}
.rgrid{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lgrid{display:flex;flex-direction:column;align-items:center;gap:8px}
.btn.ds{color:#ffb38a;border-color:#6a3a22}
.grid{display:grid;grid-template-columns:auto auto;gap:8px;align-items:center;justify-items:center}
.btn{--s:clamp(46px,14vw,62px);width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--edge);
  background:var(--panel);color:var(--fg);font:700 14px var(--body);display:grid;place-items:center;padding:0;touch-action:none}
.btn.big{--s:clamp(56px,17vw,76px);border-color:var(--gold);color:var(--gold);font-size:16px}
.btn.sm{--s:clamp(42px,12vw,54px);font-size:12px}
.btn.sp{color:var(--line7hi);border-color:#4c5410}
.btn.it{color:#f6d55c;border-color:#6a5a22}
.btn.gd{color:#a0cdff;border-color:#2c4766}
.btn.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.keys{margin:0;color:var(--muted);font-size:13px;text-align:center;line-height:1.9;max-width:70ch}
kbd{font:700 11px var(--body);background:var(--panel);border:1px solid var(--edge);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--fg)}
.rank{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 16px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.rank-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank h2{margin:0;font:400 20px var(--display);color:var(--gold);text-wrap:balance}
.rank .scope{font-size:11px;color:var(--muted)}
.submit{display:flex;flex-direction:column;gap:8px;border:1px solid #4c5410;background:rgba(116,127,0,.12);border-radius:8px;padding:10px 12px}
.submit p{margin:0;font-size:13px;color:var(--line7hi);font-weight:700}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:700 15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--edge);border-radius:6px;padding:9px 10px}
.cta{font:700 14px var(--body);border:0;border-radius:6px;padding:9px 16px;background:var(--gold);color:#1a1205;cursor:pointer;white-space:nowrap}
.cta.ghost{background:transparent;color:var(--fg);border:1px solid var(--edge)}
.cta:disabled{opacity:.5;cursor:default}
.msg{font-size:12px;color:var(--muted);min-height:1em;margin:0}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 2px;border-top:1px solid var(--edge);font-size:14px}
li:first-child{border-top:0}
li .n{font:400 16px var(--display);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
li:nth-child(1) .n{color:var(--gold)}li:nth-child(2) .n{color:#cfd6d8}li:nth-child(3) .n{color:#c98a52}
li .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .st{font-size:11px;color:var(--muted);white-space:nowrap}
li .st.won{color:var(--line7hi)}
li .sc{font:400 16px var(--display);color:var(--fg);font-variant-numeric:tabular-nums;text-align:right;min-width:56px}
li.me{background:rgba(227,183,92,.08)}
.empty{font-size:13px;color:var(--muted);padding:10px 2px;margin:0}
.brag{display:flex;flex-direction:column;gap:6px;border:1px solid var(--gold);background:linear-gradient(135deg,rgba(227,183,92,.16),rgba(116,127,0,.10));border-radius:10px;padding:12px 14px}
.brag-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brag-lbl{font-size:12px;color:var(--muted);font-weight:700}
.brag-score{font:400 28px var(--display);color:var(--gold)}
.brag-sub{margin:0;font-size:12px;color:var(--line7hi);font-weight:700}
.brag-msg{margin:0;white-space:pre-line;font-size:13px;line-height:1.5;color:var(--fg);background:rgba(0,0,0,.25);border-radius:6px;padding:8px 10px}
.brag-row{display:flex;gap:8px;flex-wrap:wrap}
.brag-go{flex:1;font-size:15px;padding:11px 16px}
.actions{display:flex;gap:8px;justify-content:flex-end}
@media (pointer:coarse){
  .pad{display:flex}
  .keys{display:none}
  canvas{width:min(100%, calc((100vh - 250px) * 16 / 9));width:min(100%, calc((100dvh - 250px) * 16 / 9))}
  body.ranking .pad{display:none}
}

.logo{white-space:nowrap;min-width:0;font-size:clamp(15px,4.4vw,20px);gap:6px}
.tools{flex-shrink:0;gap:5px}
.mini{white-space:nowrap}
@media (max-width:440px){.mini{padding:6px 9px}.mini.icon{padding:5px 7px}.badge{width:18px;height:18px;font-size:10px}}
.tip{display:none;margin:0;color:var(--muted);font-size:12px;text-align:center}
@media (pointer:coarse) and (orientation:portrait){.tip{display:block}}
@media (pointer:coarse) and (orientation:landscape){
  body{padding-block:0}
  .wrap{gap:0;max-width:none}
  .top{position:fixed;top:auto;bottom:calc(22px + clamp(44px,13vh,60px) + env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));width:auto;z-index:5;opacity:.6}
  .top .mini{padding:4px 8px;font-size:11px}
  .logo{display:none}
  canvas{width:min(100%, calc(100vh * 16 / 9));width:min(100%, calc(100dvh * 16 / 9));border:0;border-radius:0}
  .pad{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;align-items:flex-end;box-sizing:border-box;
    padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .pad .btn{pointer-events:auto;opacity:.6;background:rgba(23,30,25,.7)}
  .pad .btn.on{opacity:.95;background:var(--gold)}
  .btn{--s:clamp(44px,13vh,60px)}.btn.big{--s:clamp(52px,16vh,72px)}.btn.sm{--s:clamp(40px,11vh,52px)}
  body.ranking canvas{width:min(100%, calc(55vh * 16 / 9))}
  body.ranking .top{position:static;transform:none;opacity:1}
}
</style>

<div class="wrap">
  <div class="top">
    <span class="logo"><span class="badge" aria-hidden="true">7</span>지하철빌런특공대</span>
    <div class="tools">
      <button id="sh" class="mini" type="button">공유</button>
      <button id="rk" class="mini" type="button">랭킹</button>

      <button id="snd" class="mini icon" type="button" aria-label="소리 끄기" aria-pressed="false"><svg class="on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="off" hidden viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <canvas id="g" width="960" height="540" aria-label="지하철빌런특공대 게임 화면"></canvas>
  <div class="pad" aria-label="터치 조작">
    <div class="lgrid">
      <button class="btn sm it" id="b-item" data-k="item">아이템</button>
      <div class="grp">

    <div class="rgrid">
      <div class="grp">
        <button class="btn" id="b-jump" data-k="jump">점프</button>
        <button class="btn sm sp" id="b-sp" data-k="sp">특기</button>
      </div>
      <div class="grp">
        <button class="btn gd" id="b-guard" data-k="guard">막기</button>
        <button class="btn big" id="b-atk" data-k="atk">베기</button>
      </div>
    </div>
  </div>
  <p class="keys">이동 <kbd>←</kbd> <kbd>→</kbd> · 대시 방향키 두 번 (또는 <kbd>Shift</kbd>) · 점프 <kbd>Space</kbd> · 베기 <kbd>Z</kbd> 연타 3단 콤보 · 막기 <kbd>X</kbd> 누르고 있기, 맞기 직전에 누르면 패링 · 특기 <kbd>C</kbd> · 아이템 <kbd>Q</kbd> 또는 <kbd>1</kbd>~<kbd>5</kbd></p>
  <p class="tip">휴대폰을 가로로 돌리면 화면이 커집니다</p>
  <section class="rank" id="rank" hidden aria-labelledby="rank-title">
    <div class="rank-head"><h2 id="rank-title">TOP 10 랭킹</h2><span class="scope" id="rank-scope">불러오는 중</span></div>
    <div class="brag" id="brag" hidden>
      <div class="brag-top"><span class="brag-lbl">이번 기록</span><span class="brag-score" id="brag-score"></span></div>
      <p class="brag-sub" id="brag-sub"></p>
      <p class="brag-msg" id="brag-msg"></p>
      <div class="brag-row"><button class="cta brag-go" type="button" id="brag-go">친구에게 도전장 보내기</button><button class="cta ghost" type="button" id="brag-new">멘트 바꾸기</button></div>
    </div>
    <form class="submit" id="rank-form" hidden>
      <p id="rank-prompt">점수를 등록하세요</p>
      <div class="row"><input id="rank-name" maxlength="10" placeholder="이름 (최대 10자)" autocomplete="nickname"><button class="cta" id="rank-save" type="submit">등록</button></div>
    </form>
    <p class="msg" id="rank-msg"></p>
    <ol id="rank-list"></ol>
    <div class="actions"><button class="cta ghost" type="button" id="rank-close">닫기</button><button class="cta ghost" type="button" id="rank-share">점수 공유</button><button class="cta" type="button" id="rank-again">다시 하기</button></div>
  </section>
</div>

<script src="assets.js"></script>
<script>
/* ===== core ===== */
const SHARE_URL='https://rhkrqod-svg.github.io/subway-villain/';
const BRAG=[
 s=>`7호선 빌런 소탕 ${s.sc}점 찍음 😎
${s.stage}까지 뚫었는데 넌 몇 칸까지 가냐?`,
 s=>`${s.ch}로 ${s.sc}점 🚇
이거 못 넘으면 내일부터 지하철 타지 마라 ㅋㅋ`,
 s=>`지하철빌런특공대 ${s.sc}점…
내 점수 깨면 커피 쏜다 ☕ (못 깰 듯)`,
 s=>`퇴근길 빌런들 다 정리하고 왔다 💥 ${s.sc}점
너도 7호선 탈 자격 있는지 테스트해봐`,
 s=>`${s.stage}에서 장렬히 전사… ${s.sc}점 🪦
복수해 줄 사람 구함`
];
let bragIdx=Math.floor(Math.random()*BRAG.length);
function bragInfo(){
  const r=lastRun||{score:typeof score!=='undefined'?score:0,car:typeof car!=='undefined'?car:1};
  const rows=(board||[]).slice(0,10);let rank=0;
  if(r.score>0&&(rows.length<10||r.score>rows[9].score))rank=rows.filter(x=>x.score>r.score).length+1;
  return{sc:Number(r.score||0).toLocaleString('ko-KR'),stage:fmtStage(r),ch:(CH&&CH.name)||'단소살인마',rank,raw:r.score||0};
}
function bragText(){
  const i=bragInfo();let t=BRAG[bragIdx](i);
  if(i.rank)t=`🏆 공개 랭킹 ${i.rank}위 등극! `+t;
  return t+String.fromCharCode(10)+'👇 바로 도전하기 (설치·로그인 없음)';
}
function updateBrag(){
  const b=document.getElementById('brag');if(!b)return;
  if(!lastRun||!lastRun.score){b.hidden=true;return}
  const i=bragInfo();b.hidden=false;
  document.getElementById('brag-score').textContent=i.sc+'점';
  document.getElementById('brag-sub').textContent=(i.rank?`지금 기록이면 TOP 10 중 ${i.rank}위 · `:'')+i.stage;
  document.getElementById('brag-msg').textContent=bragText();
}
async function shareGame(withScore,btn){
  const text=withScore&&lastRun&&lastRun.score?bragText():'7호선 빌런 소탕 액션 지하철빌런특공대 🚇'+String.fromCharCode(10)+'설치·로그인 없이 바로 플레이!';
  try{if(navigator.share){await navigator.share({title:'지하철빌런특공대',text,url:SHARE_URL});return}}catch(e){if(e&&e.name==='AbortError')return}
  const all=text+String.fromCharCode(10)+SHARE_URL;let ok=false;
  try{await navigator.clipboard.writeText(all);ok=true}catch(e){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=all;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}
  if(btn){const o=btn.textContent;btn.textContent=ok?'복사됨! 카톡에 붙여넣기':'복사 실패';setTimeout(()=>btn.textContent=o,2000)}
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#sh,#rank-share,#brag-go,#brag-new');if(!b)return;e.preventDefault();
  if(b.id==='brag-new'){bragIdx=(bragIdx+1)%BRAG.length;updateBrag();return}
  shareGame(b.id!=='sh',b)});

const $=s=>document.querySelector(s);
const cv=$('#g'),ctx=cv.getContext('2d');
const W=480,H=270,FLOOR=226,G=1300,LINE7='#747f00',LINE7HI='#c6d33a';
const Z=1.9,VW=W/Z,VH=H/Z,CAMY=FLOOR-VH*.9,TILE=Math.round(484/Z),TK=TILE/484,TILES=3,CAR_LEN=TILE*TILES;
const DISP='"Black Han Sans","Noto Sans KR",sans-serif',BODY='"Noto Sans KR",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
let scale=1,t=0;
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.max(W,Math.round((r.width||W)*dpr));cv.height=Math.round(cv.width*H/W);scale=cv.width/W}
addEventListener('resize',resize);resize();

/* draw helpers: every figure color passes through col(), so a whole figure can be tinted or remapped */
let TINT=null,CMAP=null;
const col=c=>TINT||(CMAP?CMAP(c):c);
const OUT='#0f1013',SHC={},SHD={};
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255]}
function toHex(r,g,b){const f=v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0');return'#'+f(r)+f(g)+f(b)}
function dk(c){if(SHC[c])return SHC[c];const[r,g,b]=hex(c);return SHC[c]=toHex(r*.7,g*.7,b*.7)}
function shadowMap(c){if(c[0]!=='#'||c.length!==7)return c;if(SHD[c])return SHD[c];const[r,g,b]=hex(c),l=r*.3+g*.59+b*.11;return SHD[c]=toHex(l*.42+b*.2+18,l*.3+10,l*.62+r*.12+34)}
function R(x,y,w,h,c){ctx.fillStyle=col(c);ctx.fillRect(x,y,w,h)}
function L(x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke()}
function ln(x0,y0,x1,y1,c,w){ctx.strokeStyle=col(c);ctx.lineWidth=w;ctx.lineCap='round';L(x0,y0,x1,y1)}
function seg2(x0,y0,x1,y1,x2,y2,w1,w2,c1,c2){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=col(OUT);ctx.lineWidth=w1+2;L(x0,y0,x1,y1);ctx.lineWidth=w2+2;L(x1,y1,x2,y2);ctx.strokeStyle=col(c1);ctx.lineWidth=w1;L(x0,y0,x1,y1);ctx.strokeStyle=col(c2);ctx.lineWidth=w2;L(x1,y1,x2,y2)}
function blob(p,fill,out=true){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();ctx.fillStyle=col(fill);ctx.fill();if(out){ctx.strokeStyle=col(OUT);ctx.lineWidth=1.1;ctx.lineJoin='round';ctx.stroke()}}
function ell(x,y,rx,ry,fill,out=true,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fillStyle=col(fill);ctx.fill();if(out){ctx.strokeStyle=col(OUT);ctx.lineWidth=1.1;ctx.stroke()}}

  o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+dur+.05);

function drum(f0,f1,dur,vol,when=0){
  if(!ac||muted)return;const t0=ac.currentTime+Math.max(0,when),o=ac.createOscillator(),g=ac.createGain();

function update(raw){
  stT+=raw;t+=raw;if(banner)banner.t-=raw;
  shake=Math.max(0,shake-raw*30);flashA=Math.max(0,flashA-raw*2.5);
  sweepT-=raw;if(sweepT<=0){sweepT=rnd(1.6,3.6);sweep=0}if(sweep>=0){sweep+=raw*2.4;if(sweep>1)sweep=-1}
  if(state==='title')return;
  if(state==='select'){
    if(stT>.25){
      if(pressed.left){sel=(sel+2)%3;CH=CHARS[sel];sfx.pick()}
      if(pressed.right){sel=(sel+1)%3;CH=CHARS[sel];sfx.pick()}
      if(pressed.atk||pressed.jump||pressed.sp)startWith(sel);
    }
    return;
  }
  if(state==='trans'){
    transT+=raw;
    if(transT>=.6&&!swapped){swapped=true;car++;startCar();if(car===11){sfx.win();banner={t:3.4,s:'열 칸 평정! 여기부터 무한 모드',s2:'쓰러질 때까지 점점 강해집니다'}}}
    if(transT>=1.2)state='play';return;
  }
  if(state==='intro'){intro.t+=raw;if(intro.t>3.4)endIntro();return}
  if(state==='upgrade'){
    if(stT>.45){
      if(pressed.left){pickSel=(pickSel+2)%3;sfx.pick()}
      if(pressed.right){pickSel=(pickSel+1)%3;sfx.pick()}
      if(pressed.atk||pressed.jump||pressed.sp)takeUpgrade(pickSel);
    }
    return;
  }
  if(state==='over'||state==='win'){updFx(raw*.5);return}
  bufInput();
  if(cutin){cutin.t+=raw;if(cutin.t>=.5){cutin=null;doSpecial()}return}
  if(hs>0){hs-=raw;return}
  let dt=raw;if(slow>0){slow-=raw;dt*=.28}
  runTime+=dt;if(!doorOpen)carTime+=dt;if(gradeFx)gradeFx.t+=raw;
  for(const q of timers){q.t-=dt;if(q.t<=0){q.fn();q.done=true}}timers=timers.filter(q=>!q.done);
  updFx(dt);updPlayer(dt);if(state!=='play')return;
  for(const e of enemies){updEnemy(e,dt);if(state!=='play')return}
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i],b=enemies[j];if(a.dead||b.dead||!a.awake||!b.awake||a.st==='dash'||b.st==='dash'||a.air||b.air)continue;
    const d=b.x-a.x,min=(a.w+b.w)/2*.7;if(Math.abs(d)<min){const p=(min-Math.abs(d))/2*(d>=0?1:-1);a.x-=p;b.x+=p}
  }
  enemies=enemies.filter(e=>!(e.dead&&e.deadT<=0));
  updShots(dt);if(state!=='play')return;
  updItems(dt);
  if(!doorOpen&&enemies.length===0){
    gradeCar();
    doorOpen=true;sfx.chime();
    banner={t:2.6,s:car===10?'모든 칸 평정! 마지막 문이 열립니다':'내리실 문은 오른쪽입니다',s2:'오른쪽 끝 문으로 이동하세요'};
  }
  const tx=clamp(P.x-VW*.42+P.face*10,0,CAR_LEN-VW);camX+=(tx-camX)*Math.min(1,dt*7);
}
